name: Yarn lock

on:
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'kotlin-js-store/**'

concurrency:
  group: yarn-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  TITLE: "chore(deps): update the yarn lock files"

jobs:
  regenerate:
    name: Regenerate
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.locks.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate the yarn locks
        id: locks
        run: ./.github/scripts/update-yarn-lock --github-output "$GITHUB_OUTPUT" --out "$RUNNER_TEMP/yarn-lock"

      - name: Upload the yarn locks
        if: steps.locks.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yarn-lock
          path: ${{ runner.temp }}/yarn-lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the bot token
        env:
          GH_TOKEN: ${{ secrets.YARN_LOCK_TOKEN }}
        run: '[ -n "$GH_TOKEN" ] || { echo "::error::Add a YARN_LOCK_TOKEN repository secret with contents write access."; exit 1; }'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.YARN_LOCK_TOKEN }}

      - name: Download the yarn locks
        uses: actions/download-artifact@v8
        with:
          name: yarn-lock
          path: ${{ runner.temp }}/yarn-lock

      - name: Publish the yarn locks
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/publish-yarn-lock --locks "$RUNNER_TEMP/yarn-lock"
